<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="ZLHBOfmEGCqmZlpnqv5IV40MRGlNLqHG2dFXYanR9bk"
    />
    <meta
      name="description"
      content="Read and search the SkyFactory 5 task book online without opening Minecraft. Browse chapters and track completed tasks in your browser. Unofficial fan-made reader."
    />
    <meta name="theme-color" content="#15110d" />
    <link
      rel="preload"
      href="/src/assets/minecraft/Minecraft.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <!-- First-paint styles must work before JavaScript or external CSS arrives. -->
    <style>
      html {
        background: #15110d;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #15110d;
      }
      body[data-loading]
        > :is(.layout, .sidebar-toggle, .sidebar-backdrop, .foot) {
        visibility: hidden;
      }
      .startup {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        padding: 24px;
        background: #15110d;
        color: #dcc6a1;
        text-align: center;
        font:
          14px/1.7 ui-monospace,
          monospace;
      }
      .startup[hidden],
      .startup [hidden] {
        display: none;
      }
      .startup svg {
        margin-bottom: 16px;
        color: #947851;
      }
      .startup p {
        margin: 0;
        max-width: 34ch;
      }
      .startup button {
        margin-top: 16px;
        padding: 6px 12px;
        border: 1px solid #947851;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .startup button:is(:hover, :focus-visible) {
        outline: none;
        border-color: #fff0cc;
        color: #fff0cc;
      }
    </style>
    <title>SkyFactory 5 Task Book — Online Reader &amp; Checklist</title>
  </head>
  <body data-background="dirt" data-loading>
    <div id="startup" class="startup" aria-label="Opening task book">
      <svg
        width="40"
        height="32"
        viewBox="0 0 40 32"
        fill="none"
        aria-hidden="true"
        shape-rendering="crispEdges"
      >
        <path
          d="M20 7 16 5H3v22h13l4 2 4-2h13V5H24zM20 7v22"
          stroke="currentColor"
          stroke-width="2"
        />
      </svg>
      <p id="startup-status" role="status">Opening book…</p>
      <button id="startup-retry" type="button" hidden>Try again</button>
      <noscript
        ><style>
          #startup-status {
            display: none;
          }
        </style>
        <p>
          Enable JavaScript to open the task book. Your saved progress will stay
          in this browser.
        </p></noscript
      >
    </div>
    <button
      id="sidebar-toggle"
      class="sidebar-toggle"
      aria-controls="chapters-panel"
      aria-expanded="true"
      aria-label="Hide chapters"
      title="Hide chapters"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        aria-hidden="true"
        shape-rendering="crispEdges"
      >
        <path
          fill="currentColor"
          fill-rule="evenodd"
          d="M2 3h20v18H2zm2 2v14h16V5z"
        />
        <path fill="currentColor" d="M9 5h2v14H9z" />
        <path
          class="sidebar-icon-pane"
          fill="currentColor"
          opacity="0.25"
          d="M4 5h5v14H4z"
        />
      </svg>
    </button>
    <button
      id="sidebar-backdrop"
      class="sidebar-backdrop"
      aria-label="Close chapters"
      tabindex="-1"
      hidden
    ></button>
    <div class="layout">
      <aside
        id="chapters-panel"
        class="sidebar-panel"
        aria-label="Book chapters"
      >
        <div class="sidebar-heading">Chapters</div>
        <nav aria-label="Chapters" id="nav"></nav>
      </aside>
      <main class="reader" aria-label="Task book reader">
        <div class="tools">
          <div class="book-search">
            <svg
              class="search-icon"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              aria-hidden="true"
              focusable="false"
              shape-rendering="crispEdges"
            >
              <path
                fill="currentColor"
                fill-rule="evenodd"
                d="M4 1h7v2h2v7h-2v2H4v-2H2V3h2zm1 2v2H4v4h2v1h4V8h1V4H9V3z"
              />
              <path
                fill="currentColor"
                d="M11 11h3v2h2v2h2v3h-3v-2h-2v-2h-2z"
              />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="Search tasks, mods, or chapters…"
              aria-label="Search the task book"
              aria-keyshortcuts="/"
            />
          </div>
          <div class="reader-status hint">
            <div id="status" aria-live="polite"></div>
            <div
              id="search-results"
              class="search-results"
              role="group"
              aria-label="Search result navigation"
              hidden
            >
              <button
                id="search-previous"
                class="search-step"
                type="button"
                aria-label="Previous matching page"
                title="Previous matching page (Shift+Enter)"
                aria-keyshortcuts="Shift+Enter"
                disabled
              >
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 12 12"
                  aria-hidden="true"
                  shape-rendering="crispEdges"
                >
                  <path
                    fill="currentColor"
                    d="M9 1H7v2H5v2H3v2h2v2h2v2h2V8H7V4h2z"
                  />
                </svg>
              </button>
              <span id="search-count" aria-live="polite"></span>
              <button
                id="search-next"
                class="search-step"
                type="button"
                aria-label="Next matching page"
                title="Next matching page (Enter)"
                aria-keyshortcuts="Enter"
                disabled
              >
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 12 12"
                  aria-hidden="true"
                  shape-rendering="crispEdges"
                >
                  <path
                    fill="currentColor"
                    d="M3 1h2v2h2v2h2v2H7v2H5v2H3V8h2V4H3z"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div
          id="book"
          class="book-viewport"
          tabindex="0"
          aria-label="Task book. Use left and right arrow keys to turn pages."
          aria-busy="true"
        >
          <div class="minecraft-book">
            <div id="leaves" class="book-leaves"></div>
            <button
              id="previous"
              class="page-turn previous"
              aria-label="Previous two pages"
              disabled
            ></button>
            <button
              id="next"
              class="page-turn next"
              aria-label="Next two pages"
              disabled
            ></button>
          </div>
        </div>
      </main>
    </div>
    <footer class="foot">
      <div>SkyFactory 5 · v5.0.8</div>
      <a
        href="https://github.com/DarkPacks/SkyFactory-5/blob/aae443225cfb87da6ba1848030d89ee2423ccc9a/src/minecraft/config/checklist/tasks.txt"
        target="_blank"
        rel="noopener"
        >Book by Darkosto &amp; SF5 team</a
      >
    </footer>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
